<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="app.css">
    <link rel="icon" type="image/png" href="icons/icon128.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>YT Music FM</title>
</head>

<body class="bg-n1 text-t0 p-16">
    <h1>Settings</h1>
    <h3>Last FM Connection</h3>

    <div id="no-login-div" hidden>
        <p id="connect-as">The extensions requires you to connect to Last FM.
            <br>
        </p>
        <button id="authorize-button" class="mt-8 main-button">Connect Last FM</button>
    </div>

    <div id="logged-in-div" hidden>
        <p id="connect-as">You are connected as <b><span id="username"></span></b></p>
        <button id="unauthorize-button" class="mt-8 danger-button">Disconnect</button>
    </div>

    <h1 class="mt-16">About</h1>
    <h3>Version</h3>
    <p>0.0.6</p>

    <h3 class="mt-8">Repository</h3>
    <a href="https://github.com/lighttigerxiv/yt-music-fm">https://github.com/lighttigerxiv/yt-music-fm</a>

    <script src="env.js"></script>
    <script src="lastfm.js"></script>
    <script type="module" src="options.js"></script>
</body>

</html>
